[project]
name = "unios-rag"
version = "0.1.0"
description = "Implementation of a scraper and agentic RAG using LangChain, FastAPI WebSockets, Postgres and pgvector."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/utils",
    "services/api",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["core", "utils", "api"]

[tool.ruff.lint.per-file-ignores]
# Prompts are prose; wrapping them would change the text sent to the model.
"**/prompt.py" = ["E501"]
